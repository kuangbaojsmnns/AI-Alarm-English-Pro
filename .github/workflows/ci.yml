name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: app
        run: |
          if [ -d lib ]; then
            flutter analyze
          else
            echo "Flutter app source is not scaffolded yet; dependency resolution completed."
          fi
      - name: Run Flutter tests
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No Flutter tests are present yet; skipping."
          fi

  fastapi:
    name: FastAPI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q server
